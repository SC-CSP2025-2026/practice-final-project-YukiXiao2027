<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Search</title>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@200;300;400&display=swap" 
    rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <div class="container">
      <div class="row">
        <h1>Book Search</h1>
      </div>
      <div class="row">
        <div class="col">
          <input type="text" class="search-input" placeholder="Please enter a keyword" />
        </div>
      </div>
      <div class="row">
        <p>
          <a id="fantasy-btn" href="#" class="btn btn-secondary my-2">Fantasy</a >
          <a id="hp-btn" href="#" class="btn btn-info my-2">HarryPotter</a>
          <a id="shakespeare-btn" href="#" class="btn btn-info my-2">Shakespeare</a>
        </p>
      </div>
      <div class="row">
        <div class="col">
        <ul class="list-group books-list">
        </ul>
        </div>
      </div>
    </div>
    <script src="js/env.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
